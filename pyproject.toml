[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-response-auditor"
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
version = "0.2.0"
description = "Policy-grounded quality auditor for AI customer support responses."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "streamlit>=1.33",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "plotly>=5.20",
  "httpx>=0.27",
  "requests>=2.31",
  "openai>=1.30,<3.0",
  "anthropic>=0.25,<2.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "python-dotenv>=1.0",
  "tenacity>=8.2",
  "rich>=13.7",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "pre-commit>=3.7"]
postgres = ["psycopg[binary]>=3.1"]
screenshots = ["playwright>=1.44"]

[tool.setuptools.packages.find]
include = ["auditor*", "backend*", "frontend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Homepage = "https://github.com/sanjaymouraly/ai-customer-support-quality-auditor"
Repository = "https://github.com/sanjaymouraly/ai-customer-support-quality-auditor"
Issues = "https://github.com/sanjaymouraly/ai-customer-support-quality-auditor/issues"

