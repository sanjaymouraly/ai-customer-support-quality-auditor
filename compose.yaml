services:
  api:
    build: .
    container_name: auditor-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////app/db/auditor.db
    volumes:
      - ./data:/app/data
      - auditor-db:/app/db
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: .
    container_name: auditor-frontend
    ports:
      - "8501:8501"
    environment:
      # Use the published host port so the UI also works in sandboxes that block
      # direct container-to-container traffic. On a normal Docker network,
      # API_BASE_URL=http://api:8000 can be used instead.
      - API_BASE_URL=http://host.docker.internal:8000
      - API_ACCESS_TOKEN=${API_ACCESS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on: [api]

volumes:
  auditor-db:
